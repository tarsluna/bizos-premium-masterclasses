<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transcriptions · BizOS Premium</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><header><span class="brand">BizOS <b>Premium</b></span><span class="badge">Bibliothèque privée</span></header>
<main><aside><h1>Les masterclasses,<br>mot pour mot.</h1><p class="intro">Retrouve une idée, une méthode ou un passage. Copie la transcription pour travailler avec.</p><label for="search">Rechercher une masterclass</label><input id="search" type="search" placeholder="Malik, vente, acquisition…" autocomplete="off"><nav id="list" aria-label="Masterclasses"></nav></aside>
<section class="reader"><div id="notice" role="status" aria-live="polite">Vérification de ton accès…</div><div id="content" hidden><div class="tools"><div><p id="collection" class="eyebrow"></p><h2 id="title"></h2></div><button id="copy" type="button">Tout copier</button></div><p id="meta" class="meta"></p><label class="sr-only" for="text">Transcription complète, sélectionnable et copiable</label><textarea id="text" readonly spellcheck="false"></textarea><p class="footnote">Transcription automatique : des erreurs de reconnaissance peuvent subsister.</p></div></section></main></body></html>
